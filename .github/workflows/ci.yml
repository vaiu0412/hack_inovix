name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (offline, no keys)
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t deport:ci .
      - name: Start and check health
        run: |
          docker run -d --name deport -p 8501:8501 -v deport-data:/data deport:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker exec deport python -c "from modules import store; store.init_db(); print(store.db_path(), store.db_path().exists())"
          docker exec deport test -f /data/deport.db
      - name: Logs
        if: always()
        run: docker logs deport || true
