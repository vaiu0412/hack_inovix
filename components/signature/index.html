<!doctype html>
<!-- DEPORT signature pad: draw with a finger or mouse, "Use signature" sends a PNG data URL to Streamlit.
     Plain HTML/JS using Streamlit's component messages (no build step, no package). -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 14px Inter, Arial, sans-serif; color: #E2E8F0; }
  canvas { width: 100%; height: 160px; background: rgba(255,255,255,.95); border-radius: 12px; touch-action: none;
           display: block; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  button { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2);
           background: rgba(255,255,255,.08); color: #F8FAFC; font-weight: 600; font-size: 15px; }
  button.go { background: #3B82F6; border-color: #3B82F6; }
</style>
</head>
<body>
<canvas id="pad"></canvas>
<div class="row"><button id="clear"></button><button id="use" class="go"></button></div>
<script>
  function send(type, data) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*");
  }
  var pad = document.getElementById("pad"), ctx = pad.getContext("2d"), drawing = false, inked = false;
  function size() {
    var ratio = window.devicePixelRatio || 1;
    pad.width = pad.clientWidth * ratio; pad.height = pad.clientHeight * ratio;
    ctx.scale(ratio, ratio); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.strokeStyle = "#0F172A";
  }
  function point(e) {
    var r = pad.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
    return [t.clientX - r.left, t.clientY - r.top];
  }
  function start(e) { drawing = true; var p = point(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); e.preventDefault(); }
  function move(e) {
    if (!drawing) { return; }
    var p = point(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); inked = true; e.preventDefault();
  }
  function end() { drawing = false; }
  ["mousedown", "touchstart"].forEach(function (n) { pad.addEventListener(n, start); });
  ["mousemove", "touchmove"].forEach(function (n) { pad.addEventListener(n, move); });
  ["mouseup", "mouseleave", "touchend"].forEach(function (n) { pad.addEventListener(n, end); });
  document.getElementById("clear").onclick = function () {
    ctx.clearRect(0, 0, pad.width, pad.height); inked = false;
    send("streamlit:setComponentValue", {value: null, dataType: "json"});
  };
  document.getElementById("use").onclick = function () {
    if (inked) { send("streamlit:setComponentValue", {value: pad.toDataURL("image/png"), dataType: "json"}); }
  };
  var ready = false;
  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") { return; }
    var args = event.data.args || {};
    document.getElementById("clear").textContent = args.clear_label || "Clear";
    document.getElementById("use").textContent = args.use_label || "Use signature";
    if (!ready) { size(); ready = true; }
  });
  send("streamlit:componentReady", {apiVersion: 1});
  send("streamlit:setFrameHeight", {height: 222});
</script>
</body>
</html>
