[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E5E7EB"
dataframeHeaderBackgroundColor = "#F1F5F9"
linkColor = "#2563EB"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
borderColor = "#2A313B"
dataframeHeaderBackgroundColor = "#1B212A"
linkColor = "#60A5FA"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
