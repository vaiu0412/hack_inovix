name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (offline, no keys)
        run: pytest -q

  postgres:
    name: Tests on PostgreSQL + PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: deport
          POSTGRES_PASSWORD: deport
          POSTGRES_DB: deport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deport -d deport_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://deport:deport@localhost:5432/deport_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Migrations apply from scratch (Alembic)
        env:
          DATABASE_URL: postgresql://deport:deport@localhost:5432/deport_test
          DATABASE_SCHEMA: ci_migrations
        run: |
          alembic upgrade head
          alembic check   # the migrations match modules/schema.py (no drift)
          python -c "from modules import db; print(db.describe()); db.dispose(drop_schema=True)"
      - name: Pytest on PostgreSQL (each test in its own schema)
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t deport:ci .
      - name: Start and check health
        run: |
          docker run -d --name deport -p 8501:8501 -v deport-data:/data deport:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker exec deport python -c "from modules import store; store.init_db(); print(store.db_path(), store.db_path().exists())"
          docker exec deport test -f /data/deport.db
      - name: Logs
        if: always()
        run: docker logs deport || true
