[theme]
# DEPORT dark glass theme (the glass, glow and gradient blobs live in assets/style.css)
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#070B14"
secondaryBackgroundColor = "#0F172A"
textColor = "#E2E8F0"
borderColor = "#1F2A44"
linkColor = "#60A5FA"
dataframeHeaderBackgroundColor = "#111A2E"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = false

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
