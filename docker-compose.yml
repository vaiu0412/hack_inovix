# docker compose up --build   →   http://localhost:8501   (Super Admin: http://localhost:8501/console)
# Data survives restarts and rebuilds in the "deport-data" volume. Optional keys go in .env (see .env.example).
services:
  app:
    build: .
    image: deport:latest
    ports:
      - "8501:8501"
    environment:
      DB_PATH: /data/deport.db
    env_file:
      - path: .env
        required: false
    volumes:
      - deport-data:/data
      # Google sign-in needs the [auth] section of secrets.toml – uncomment to use your local file:
      # - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    restart: unless-stopped

volumes:
  deport-data:
