<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DEPORT">
  <!-- DEPORT mark: a bold geometric "D" whose inner curve is a delivery route.
       White line = the route, amber dot = the vehicle, ringed node = the decision point,
       short branch = the alternate route taken after the decision. -->
  <rect width="64" height="64" rx="15" fill="#0B1E3F"/>
  <path d="M12 10h20c12.2 0 22 9.8 22 22s-9.8 22-22 22H12z" fill="#2563EB"/>
  <path d="M43 32a12 12 0 0 1-12 12h-9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3.4"
        stroke-linecap="round" stroke-dasharray="0.1 6"/>
  <path d="M21 44V26a6 6 0 0 1 6-6h4a12 12 0 0 1 12 12" fill="none" stroke="#fff" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 32l7.5-7.5" fill="none" stroke="#F59E0B" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="43" cy="32" r="3.9" fill="#0B1E3F" stroke="#fff" stroke-width="2.4"/>
  <circle cx="30" cy="20" r="4.4" fill="#F59E0B" stroke="#0B1E3F" stroke-width="1.8"/>
</svg>
